<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>CozyCapy</title>

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="popup.css">

</head>


<body>

    <div class="room">


        <h1>
            CozyCapy
        </h1>


        <div class="capy">

            <div class="capy-placeholder">
                🐹
            </div>

        </div>



        <div class="stats">


            <h2 id="level">
                Level 1 🌱
            </h2>


            <p>
                Friendship:
                <span id="friendship">0</span>
                ❤️
            </p>


            <p>
                Mood:
                <span id="mood">
                    Happy 😊
                </span>
            </p>


            <p id="message">
                Hi! I'm happy you're here.
            </p>


        </div>




        <div class="menu">


            <button id="pet">
                Pet
            </button>


            <button id="feed">
                Feed
            </button>


            <button id="notes">
                Notes
            </button>


            <button id="memories">
                Memories
            </button>


            <button id="room">
                Room
            </button>


            <button id="closet">
                Closet
            </button>


        </div>




        <div id="food-menu" class="hidden">


            <button class="food" data-value="5">
                🍓 Strawberry
            </button>


            <button class="food" data-value="5">
                🥭 Mango
            </button>


            <button class="food" data-value="10">
                🧋 Boba
            </button>


            <button class="food" data-value="15">
                🍛 Chole Bhature ⭐
            </button>


        </div>



    </div>



    <script src="popup.js"></script>


</body>

</html>
